<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="box">
        <h1>CADASTRO</h1>
    <label for="nome_completo">Nome Completo:</label>
    <br>
    <input type="text" id="nome_completo" placeholder="Digite aqui:">
    <br><br>
    <label for="email">E-mail:</label>
    <br>
    <input type="email" id="email" placeholder="Digite aqui:">
    <br><br>
    <label for="senha">Senha:</label>
    <br>
    <input type="password" id="senha" placeholder="Digite aqui:">
     <br><br>
    <label for="birthday">Data de Nascimento:</label>
    <br>
    <input type="date" id="birthday" placeholder="Digite aqui:">
    <br><br>
    <label for="gender"> Gênero:</label>
    <br>
    <select name="Gênero" id="gender">
        <option value="sel" disabled selected >Selecione</option>
        <option value="masc">Masculino</option>
        <option value="fem">Feminino</option>
        <option value="other">Outro</option>
        <option value="not_tell">Prefiro não dizer</option>
    </select>
    <br><br>
    <label for="use_terms"> Aceito os <a class="coloring" href="Termos.html" target="_blank">termos</a></label>
    <input type="checkbox" id="use_terms">
    <br><br>
    <button class="buttonstyle"> <a class="coloring" href="Confirm.html">Cadastrar</a></button>
</body>
</html>
